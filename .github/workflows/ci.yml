name: CI Code Coverage

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: YOUR_STUDENT_ID
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: YOUR_STUDENT_ID
        run: |
          coverage run -m pytest
          coverage report
          coverage xml
          python - <<'PY'
          import csv
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_file = Path("coverage.xml")
          tree = ET.parse(xml_file)
          root = tree.getroot()

          line_rate = float(root.attrib.get("line-rate", 0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0)) * 100
          lines_covered = root.attrib.get("lines-covered", "0")
          lines_valid = root.attrib.get("lines-valid", "0")

          output = Path("coverage_report.csv")
          with output.open("w", newline="", encoding="utf-8") as file:
              writer = csv.writer(file)
              writer.writerow(["metric", "value"])
              writer.writerow(["line_coverage_percent", round(line_rate, 2)])
              writer.writerow(["branch_coverage_percent", round(branch_rate, 2)])
              writer.writerow(["lines_covered", lines_covered])
              writer.writerow(["lines_valid", lines_valid])
          PY

      - name: Upload coverage CSV
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-csv
          path: YOUR_STUDENT_ID/coverage_report.csv